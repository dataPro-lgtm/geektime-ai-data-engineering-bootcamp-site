<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="720" rx="32" fill="#081628"/>
  <rect x="88" y="52" width="784" height="84" rx="22" stroke="#45D5FF" stroke-width="4"/>
  <text x="480" y="92" fill="#F6FBFF" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">1. 文档 chunk 还能召回</text>
  <text x="480" y="122" fill="#A9C8E6" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">表面上系统仍然“像是有答案”</text>

  <path d="M480 136L480 182" stroke="#45D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M464 168L480 188L496 168" stroke="#45D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="114" y="198" width="732" height="82" rx="22" stroke="#45D5FF" stroke-width="4"/>
  <text x="480" y="236" fill="#F6FBFF" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">2. page_no / section_path / bbox / doc_version 缺失</text>
  <text x="480" y="265" fill="#A9C8E6" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">正文存在，但 provenance 已经开始掉线</text>

  <path d="M480 280L480 326" stroke="#45D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M464 312L480 332L496 312" stroke="#45D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="158" y="342" width="644" height="82" rx="22" stroke="#45D5FF" stroke-width="4"/>
  <text x="480" y="380" fill="#F6FBFF" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">3. 回答还能像对的，citation 开始不稳</text>
  <text x="480" y="409" fill="#A9C8E6" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">观众先看到的是“还能答”，不是“已经不可回指”</text>

  <path d="M480 424L480 470" stroke="#45D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M464 456L480 476L496 456" stroke="#45D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="210" y="486" width="540" height="82" rx="22" stroke="#45D5FF" stroke-width="4"/>
  <text x="480" y="524" fill="#F6FBFF" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">4. audit 与 bad case 复盘一起失效</text>
  <text x="480" y="553" fill="#A9C8E6" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">没有 provenance 的“正确答案”，在生产里并不合格</text>

  <rect x="214" y="610" width="532" height="58" rx="18" fill="#13253C" stroke="#FFCB71" stroke-width="3"/>
  <text x="480" y="647" fill="#FFD890" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">真正摧毁的是证据链，而不只是一次回答</text>
</svg>
